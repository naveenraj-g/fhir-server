version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Local development stack — Postgres + Redis only.
#
# Use this when running the API directly on the host with hot reload
# (`uv run fastapi dev app/main.py`) instead of inside a container.
# For the full containerized stack (API + Postgres + Redis), use
# docker-compose.yml instead.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#
# Then point your .env at the mapped ports, e.g.:
#   FHIR_DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/fhir-server
#   REDIS_URL=redis://localhost:6379
# ─────────────────────────────────────────────────────────────────────────────

services:
  db:
    image: postgres:15-alpine
    container_name: fhir-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fhir-server}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-fhir-server}"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fhir-redis-dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # Stopgap FHIR StructureDefinition/profile validator (HL7's Java validator,
  # wrapped in a REST API) — see docker/fhir-validator/README.md and
  # docs/structure-definitions/12-three-layer-validation-architecture.md.
  # Not called by the app yet; this just makes it available to develop against.
  fhir-validator:
    build: ./docker/fhir-validator
    container_name: fhir-validator-dev
    ports:
      - "${FHIR_VALIDATOR_PORT:-4567}:4567"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4567/version"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
