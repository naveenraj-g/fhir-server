# Controls which FHIR resource routers get mounted at startup — see
# CLAUDE.md's "Enabling/Disabling Resources" section. Toggling a value here
# and restarting the server is all it takes; no code change needed.
#
# Only lists resources served under /api/fhir/v1 (app/routers/__init__.py's
# _ROUTERS table). Vitals and Terminology are mounted separately in
# app/main.py under their own prefixes and aren't covered by this file.
routes:
  patient: true
  practitioner: true
  organization: true
  encounter: false
  appointment: false
  questionnaire_response: false
  condition: false
  service_request: false
  device_request: false
  diagnostic_report: false
  medication_request: false
  observation: false
  procedure: false
  practitioner_role: false
  schedule: false
  slot: false
  healthcare_service: false
  claim: false
  claim_response: false
  invoice: false
  location: false
  coverage: false
  medication: false
  allergy_intolerance: false
  provenance: false
  task: false
  care_plan: false
  related_person: false
  specimen: false
  document_reference: false
  immunization: false
  audit_event: false
  episode_of_care: false
  insurance_plan: false
