# Caching-layer config for fhir-server. Checked into git — not a secret,
# same spirit as configs/config.yaml (which this file is a sibling of, not a
# replacement for — see app/core/config.py's Settings.settings_customise_sources()
# for how both are loaded together). Split out on its own because caching is
# a separately-evolving concern from general app behavior: as more things
# become cacheable (FHIR profiles today, more tomorrow), this file grows
# instead of crowding config.yaml with settings that aren't really about how
# the app behaves, just about how it's allowed to go faster.
#
# This file is scoped to genuine caching only — something stored to avoid a
# re-fetch, with an eviction concept. rate_limit lives in configs/config.yaml
# instead, even though it's also Redis-backed: it's a shared sliding-window
# counter enforcing a request quota, not a cache (nothing here is being
# cached to avoid re-fetching it).
#
# The global Redis on/off switch (`redis.enabled`) is also NOT here — it
# lives in configs/config.yaml, since Redis also backs sessions and the
# get_redis() DI dependency, not just caching; whether it's available at all
# is an infra-level decision. The setting below only takes effect while that
# switch is true — forced to "memory" otherwise.
#
# Precedence is identical to config.yaml: real env var > .env > this file >
# field defaults. Nested env override example: FHIR_PROFILE_CACHE__BACKEND=memory.

fhir_profile_cache:
  # redis | memory — forced to "memory" whenever configs/config.yaml's
  # redis.enabled is false. Caches all three scope levels, fetched from the
  # fhir_profile DB table (app/models/fhir_profile/) instead of hitting it
  # on every validation: base-layer StructureDefinitions (never invalidated
  # — base profiles have no admin write path, see
  # app/fhir/profiling/README.md) and country-/organization-layer
  # StructureDefinitions (invalidated on write — once an admin edit path
  # exists for either, that write must evict the corresponding cache entry
  # rather than update it in place, so the next request for it repopulates
  # from the DB instead of serving stale data).
  backend: redis
