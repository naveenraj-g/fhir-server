# Application-behavior config for fhir-server. Checked into git — not a
# secret, same spirit as alembic.ini. True per-environment secrets (DB/Redis
# URLs, IAM JWKS/issuer) still live in .env, never here. Precedence, highest
# first: real env var > .env > this file > field defaults — see
# app/core/config.py's Settings.settings_customise_sources().

logging:
  # Root log level. DEBUG turns on the per-layer flow logging that services and
  # repositories emit; INFO keeps only business outcomes + the access log.
  level: INFO

  # "json" (one JSON object per line — what log aggregators want) or "console"
  # (flat, human-readable). Use console locally, json everywhere else.
  format: json

  # ⚠️  PHI WARNING — LOCAL DEVELOPMENT ONLY, NEVER ENABLE IN PRODUCTION.
  # This is a FHIR server. Turning this on logs full request payloads at DEBUG:
  # patient names, addresses, birth dates, identifiers. The `redact` list below
  # is a backstop for obvious secrets, NOT a PHI safeguard.
  debug_payloads: false

  # Any SQL statement slower than this emits a `db.slow_query` WARNING.
  slow_query_ms: 500

  # Log every SQL statement at DEBUG (very noisy — debugging only).
  sql_echo: false

  # Re-enable Uvicorn's own per-request line:
  #   INFO: 127.0.0.1:53412 - "GET /api/fhir/v1/patients/ HTTP/1.1" 200 OK
  # Off because app/middleware/access_log.py already logs every request with
  # more detail (duration_ms, request_id, operation_id, actor), and because
  # Uvicorn's logger keeps its own handler — so its line stays PLAIN TEXT even
  # when format is json, breaking anything that parses the stream.
  uvicorn_access: false

  # Field names masked by log_payload(), matched case-insensitively at any
  # nesting depth, even when debug_payloads is on.
  redact:
    - authorization
    - token
    - password
    - secret

rate_limit:
  backend: redis
  read_limit: 100
  write_limit: 20
  window_seconds: 60

routes:
  # Which FHIR resource routers get mounted under /api/fhir/v1 at startup —
  # see CLAUDE.md's "Enabling/Disabling Resources" section. Not listed = not
  # mounted. Vitals and Terminology are mounted separately in app/main.py
  # under their own prefixes and aren't covered by this list.
  enabled:
    # - patient
    # - practitioner
    - organization
    # - location
    - healthcare_service
    - practitioner_role
