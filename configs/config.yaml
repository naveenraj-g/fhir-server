# Application-behavior config for fhir-server. Checked into git — not a
# secret, same spirit as alembic.ini. True per-environment secrets (DB/Redis
# URLs, IAM JWKS/issuer) still live in .env, never here. Precedence, highest
# first: real env var > .env > this file > field defaults — see
# app/core/config.py's Settings.settings_customise_sources().

app:
  title: "FHIR Server"
  version: "1.0.0"
  # Gates only the interactive /docs and /redoc UIs. /openapi.json stays
  # reachable regardless — it's the FastMCP contract, see CLAUDE.md's
  # "OpenAPI Spec = MCP Contract".
  docs_enabled: true

cors:
  # No CORSMiddleware is registered at all while this is false — this server
  # has never had a browser-facing caller. Flip on and fill in allow_origins
  # the moment one exists.
  enabled: false
  allow_origins: []
  allow_credentials: false
  allow_methods: ["*"]
  allow_headers: ["*"]

auth:
  # Signature algorithms PyJWT accepts when verifying a token against the
  # IAM's JWKS (IAM_JWKS_URL/IAM_ISSUER, in .env). Must match what the IAM
  # actually signs with.
  algorithms: [EdDSA, RS256]

database:
  # SQLAlchemy async engine pool sizing. Defaults match SQLAlchemy's own
  # (pool_size/max_overflow) except pool_pre_ping, which we turn on so a
  # connection Postgres/a proxy silently dropped is caught and replaced at
  # checkout instead of surfacing as a mid-request error.
  pool_size: 5
  max_overflow: 10
  pool_pre_ping: true
  pool_recycle: 1800

logging:
  # Root log level. DEBUG turns on the per-layer flow logging that services and
  # repositories emit; INFO keeps only business outcomes + the access log.
  level: INFO

  # "json" (one JSON object per line — what log aggregators want) or "console"
  # (flat, human-readable). Use console locally, json everywhere else.
  format: json

  # ⚠️  PHI WARNING — LOCAL DEVELOPMENT ONLY, NEVER ENABLE IN PRODUCTION.
  # This is a FHIR server. Turning this on logs full request payloads at DEBUG:
  # patient names, addresses, birth dates, identifiers. The `redact` list below
  # is a backstop for obvious secrets, NOT a PHI safeguard.
  debug_payloads: false

  # Any SQL statement slower than this emits a `db.slow_query` WARNING.
  slow_query_ms: 500

  # Log every SQL statement at DEBUG (very noisy — debugging only).
  sql_echo: false

  # Re-enable Uvicorn's own per-request line:
  #   INFO: 127.0.0.1:53412 - "GET /api/fhir/v1/patients/ HTTP/1.1" 200 OK
  # Off because app/middleware/access_log.py already logs every request with
  # more detail (duration_ms, request_id, operation_id, actor), and because
  # Uvicorn's logger keeps its own handler — so its line stays PLAIN TEXT even
  # when format is json, breaking anything that parses the stream.
  uvicorn_access: true

  # Field names masked by log_payload(), matched case-insensitively at any
  # nesting depth, even when debug_payloads is on.
  redact:
    - authorization
    - token
    - password
    - secret

redis:
  # Global switch. false forces every Redis-backed dependent below
  # (currently just rate_limit.backend) to its non-Redis fallback,
  # regardless of what's written under that dependent — no per-dependent
  # edits needed to run without Redis. true (default) defers to each
  # dependent's own backend setting instead.
  enabled: true

rate_limit:
  # redis | memory — only takes effect while redis.enabled above is true;
  # forced to "memory" otherwise.
  backend: redis
  read_limit: 100
  write_limit: 20
  window_seconds: 60

pagination:
  # Defaults for the shared ListParams dependency (app/core/pagination.py)
  # used by the eight JWT/RBAC-rolled-out resources' list endpoints —
  # Patient, Practitioner, Organization, Location, HealthcareService,
  # PractitionerRole, Schedule, Slot. The other ~27 resources still declare
  # limit/offset inline per-route and are unaffected by this block.
  default_limit: 50
  max_limit: 200

fhir_validation:
  # native | java_validator — see app/core/config.py's FhirValidationConfig
  # and docs/structure-definitions/12-three-layer-validation-architecture.md.
  # "native" is this project's own fhir.schema.json structural check
  # (no invariants). "java_validator" delegates to the HL7 Java validator
  # sidecar (docker/fhir-validator/) instead, which also enforces real
  # invariants (org-1/org-2/org-3) — opt in once that container is running.
  backend: java_validator
  # Global, deploy-time choice of which country-layer profile to apply on
  # top of base R4 — e.g. "IN". null/omitted means base R4 only. One
  # deployment serves one country (same model as a single-hospital rollout
  # or a single-country SaaS deployment) — not resolved per-request/tenant;
  # see app/fhir/validation/dispatch.py's module docstring for why. Only
  # takes effect for a resource_type that has an
  # app/fhir/profiling/<resource_type>/country_<code>.json file — falls
  # back to base R4 for any resource_type that doesn't yet (today, only
  # Organization has one).
  country: IN
  java_validator:
    # Host-mapped port from docker-compose.dev.yml (API runs on the host,
    # validator runs in Docker). Override via
    # FHIR_VALIDATION__JAVA_VALIDATOR__BASE_URL=http://fhir-validator:4567
    # for the fully-containerized stacks, where it's reachable by service
    # name on the shared network instead.
    base_url: http://localhost:4567
    timeout_seconds: 30

routes:
  # Which FHIR resource routers get mounted under /api/fhir/v1 at startup —
  # see CLAUDE.md's "Enabling/Disabling Resources" section. Not listed = not
  # mounted. Vitals and Terminology are mounted separately in app/main.py
  # under their own prefixes and aren't covered by this list.
  enabled:
    # - patient
    # - practitioner
    - organization
    # - location
    # - healthcare_service
    # - practitioner_role
    # - schedule
    # - slot
